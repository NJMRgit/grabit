# The shared dev-standard gate: tests must pass, and (once design documents
# exist) a behaviour change must carry its spec. See ~/Projects/dev-standard.
name: Spec gate

on:
  pull_request:
  workflow_dispatch:

jobs:
  spec-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: NJMRgit/dev-standard
          path: tools/dev-standard
          # dev-standard is private: a read-only deploy key, kept as this secret.
          ssh-key: ${{ secrets.DEV_STANDARD_DEPLOY_KEY }}
      - name: install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends build-essential pkg-config clang-format \
            libwayland-dev libwayland-bin libcairo2-dev libxkbcommon-dev libmagic-dev \
            libcurl4-openssl-dev libjson-c-dev libdbus-1-dev
      - name: libpng newer than the runner's
        # src/capture/png_hdr.c uses png_set_cLLI/cICP/mDCV, which ubuntu 24.04's
        # libpng (1.6.43) does not have; debian trixie, which the project's own
        # CI uses, does. Build 1.6.50 into /usr/local instead of a container,
        # because a container job leaves no git history for the gate to diff.
        run: |
          curl -fsSL -o /tmp/libpng.tar.gz https://github.com/pnggroup/libpng/archive/refs/tags/v1.6.50.tar.gz
          tar xzf /tmp/libpng.tar.gz -C /tmp
          cd /tmp/libpng-1.6.50
          ./configure --prefix=/usr/local --disable-static >/dev/null
          make -j"$(nproc)" >/dev/null
          sudo make install >/dev/null
          sudo ldconfig
          pkg-config --modversion libpng
      - name: Spec/code coherence + tests
        env:
          SPEC_GATE_REPO: ${{ github.workspace }}
        run: |
          python3 tools/dev-standard/bin/spec-gate check \
            --project "grabit" \
            --range "origin/${{ github.base_ref || github.event.repository.default_branch }}..HEAD"
